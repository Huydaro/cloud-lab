services:
  web:
    image: huydaro/cloud-lab-web:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    networks:
      - cloud-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - cloud-network

networks:
  cloud-network:
    driver: bridge

volumes:
  mysql-data:
